<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enviar Alerta - Bomberos Voluntarios de Colón</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/sender.css" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>
  <!-- Login -->
  <div id="login">
    <img src="logo.png" alt="Logo Bomberos" />
    <h1>Acceso al Sistema</h1>
    <p>Ingresá tu usuario y contraseña</p>
    <input type="text" id="usuarioInput" placeholder="Usuario" autocomplete="off" />
    <input type="password" id="passwordInput" placeholder="Contraseña" />
    <button id="ingresarBtn">Ingresar</button>
    <a href="#" id="olvidéBtn" class="registro-link">¿Olvidaste tu contraseña?</a>
    <a href="registro.html" class="registro-link">¿No tenés cuenta? Solicitá acceso</a>
  </div>

  <!-- Panel principal -->
  <div id="main" style="display:none;">
    <header>
      <img src="logo.png" alt="Logo Bomberos" />
      <div id="datetime"></div>
      <button id="cerrarSesionBtn">🚪 Cerrar sesión</button>
    </header>

    <h1>Enviar Alerta</h1>

    <form id="alertForm">
      <label>Tipo de siniestro:</label>
      <select id="tipo" required>
        <option value="Incendio">Incendio</option>
        <option value="Forestal">Forestal</option>
        <option value="Accidente Vehicular">Accidente Vehicular</option>
        <option value="Rescate">Rescate</option>
        <option value="Materiales Peligrosos">Materiales Peligrosos</option>
      </select>

      <label>Dirección:</label>
      <input type="text" id="direccion" placeholder="Ej: Calle 24 entre 49 y 50" required />

      <label>Descripción:</label>
      <textarea id="descripcion" rows="3" placeholder="Detalles del siniestro"></textarea>

      <label>Despachado por:</label>
      <select id="despachadoPor" required>
        <option value="GUM">GUM</option>
        <option value="POLICÍA">POLICÍA</option>
        <option value="CUARTEL 60">CUARTEL 60</option>
      </select>

      <label>Contacto:</label>
      <input type="text" id="contacto" placeholder="Numero de la victima" />

      <button type="submit" id="sendBtn">🚨 ENVIAR ALERTA</button>
      <div id="loading">📡 Enviando alerta<span>...</span></div>
    </form>

    <div style="margin-top:30px; width:100%; max-width:800px; text-align:left; display:flex; gap:12px;">
      <a href="historial.html" id="verHistorialBtn">📜 Ver historial de alertas</a>
      <a href="estadisticas.html" id="verEstadisticasBtn">📊 Ver estadísticas</a>
    </div>
  </div>

  <script type="module" src="js/sender.js"></script>
</body>
</html>
