<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - Bomberos Voluntarios de Colón</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/registro.css" />
</head>
<body>
  <div id="formContainer">
    <img src="logo.png" alt="Logo Bomberos" />
    <h1>Solicitar Acceso</h1>
    <p>Completá tus datos. Un administrador aprobará tu solicitud.</p>

    <input type="text" id="nombreInput" placeholder="Nombre" autocomplete="off" />
    <input type="text" id="apellidoInput" placeholder="Apellido" autocomplete="off" />
    <input type="email" id="mailInput" placeholder="Correo electrónico (será tu usuario)" autocomplete="off" />
    <input type="password" id="passwordInput" placeholder="Contraseña" />
    <input type="password" id="confirmInput" placeholder="Confirmar contraseña" />

    <button id="registrarBtn">Solicitar acceso</button>
    <a href="sender.html" class="volver">⬅ Volver al inicio</a>
  </div>

  <script src="js/registro.js"></script>
</body>
</html>
