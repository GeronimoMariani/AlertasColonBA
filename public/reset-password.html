<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resetear contraseña - Bomberos Colón BA</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/registro.css" />
</head>
<body>
  <div id="formContainer">
    <img src="logo.png" alt="Logo Bomberos" />
    <h1>Nueva contraseña</h1>
    <p>Ingresá tu nueva contraseña.</p>
    <input type="password" id="passwordInput" placeholder="Nueva contraseña" />
    <input type="password" id="confirmInput" placeholder="Confirmar contraseña" />
    <button id="resetBtn">Guardar contraseña</button>
  </div>

  <script src="js/reset-password.js"></script>
</body>
</html>
