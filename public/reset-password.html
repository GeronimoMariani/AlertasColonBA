<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resetear contraseña - Bomberos Colón BA</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/base.css?v=2" />
  <link rel="stylesheet" href="css/registro.css?v=2" />
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <img src="logo.png" alt="Logo Bomberos" class="logo" />
      <div>
        <span class="eyebrow">Recuperar cuenta</span>
        <h2>Nueva<br>contraseña</h2>
        <p>Elegí una contraseña nueva para entrar a la central de despacho.</p>
      </div>
    </aside>
    <div class="auth-main">
      <div id="formContainer" class="auth-form">
        <h1>Nueva contraseña</h1>
        <p>Ingresá tu nueva contraseña.</p>
        <div class="field">
          <label for="passwordInput">Nueva contraseña</label>
          <input type="password" id="passwordInput" placeholder="Nueva contraseña" />
        </div>
        <div class="field">
          <label for="confirmInput">Confirmar contraseña</label>
          <input type="password" id="confirmInput" placeholder="Repetila" />
        </div>
        <button id="resetBtn" class="btn-red btn-block">Guardar contraseña</button>
      </div>
    </div>
  </div>

  <script src="js/reset-password.js?v=2"></script>
</body>
</html>
